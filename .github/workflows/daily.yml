name: Daily assignment digest

# Scheduled runs on shared runners are heavily deprioritised: every run between
# 2026-11-01 and 2026-11-14 started 6.5-8.6h after its 05:00 UTC cron time, so a
# "morning" digest was arriving mid-afternoon in Helsinki. workflow_dispatch runs
# are not queued that way, so an external cron calls the dispatch API instead:
#
#   POST /repos/imbiodun/moodle-deadline-notifier/actions/workflows/daily.yml/dispatches
#   {"ref": "main"}
#
# The schedule below stays only as a safety net for the external caller going
# down. --once-per-day means whichever fires first wins and the other exits
# without sending, so a late schedule run cannot produce a second digest.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Send even if a digest already went out today"
        type: boolean
        default: false
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build and send digest
        env:
          UEF_ICAL_URL: ${{ secrets.UEF_ICAL_URL }}
          TUNI_ICAL_URL: ${{ secrets.TUNI_ICAL_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Absent until the dismissal Worker is deployed, which keeps the run on
          # getUpdates polling. Both set together switches it to the webhook queue.
          DISMISS_API_URL: ${{ secrets.DISMISS_API_URL }}
          DISMISS_API_SECRET: ${{ secrets.DISMISS_API_SECRET }}
        # Inverted deliberately: in `a && b || c` an empty-string b is falsy and
        # collapses to c, so the flag has to sit on the truthy side. On a schedule
        # event `inputs` is null, which negates to true and keeps the guard on.
        run: python main.py ${{ !inputs.force && '--once-per-day' || '' }}

      - name: Commit state if changed
        run: |
          if git diff --quiet -- state.json; then
            echo "state.json did not change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update reminder state"
          git push
