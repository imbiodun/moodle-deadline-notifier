name: Moodle deadline check

on:
  schedule:
    # Runs at 06:00 UTC daily (~08:00/09:00 Finland time depending on DST).
    # Adjust the cron below if you want a different time.
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  check-deadlines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests icalendar

      - name: Run deadline check
        env:
          MOODLE_URL: ${{ secrets.MOODLE_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DAYS_AHEAD: "3"
        run: python3 moodle_notify.py
