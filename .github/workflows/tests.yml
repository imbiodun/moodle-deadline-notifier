name: Tests

on:
  push:
    branches: [main]
    # The digest job commits state.json back to main after every run. Without this
    # the daily state update would trigger a pointless test run on unchanged code.
    paths-ignore:
      - "state.json"
      - "README.md"
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches the version the daily digest runs on, so a passing suite says
      # something about the environment that actually sends the reminders.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
