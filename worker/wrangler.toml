name = "deadline-dismissals"
main = "src/index.js"
compatibility_date = "2026-11-14"

# Created with: wrangler kv namespace create DISMISSALS
# Paste the returned id below; the binding name must stay DISMISSALS.
[[kv_namespaces]]
binding = "DISMISSALS"
id = "e6d64bc2917141ce97f3c2f6e88c3c3d"

[vars]
# Not a secret: the chat id only identifies which chat may dismiss, and every write is
# already gated on the Telegram webhook secret.
TELEGRAM_CHAT_ID = "6608294257"

# Set as secrets, never as vars:
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_WEBHOOK_SECRET
#   wrangler secret put DISMISS_API_SECRET
